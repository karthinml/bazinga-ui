<a [routerLink]="'/products'" style="margin-left: 2%;">Home</a>
<div *ngIf="cartData.length" class="cart">
    <div *ngFor="let item of cartData; let i=index;" class="row details">
        <div class="col-md-3 col-lg-3 col-sm-4">
            <img [src]="item.image" class="image-style"/><br>
            {{item.itemName}}
        </div>
        <div class="col-md-3 col-lg-3 col-sm-3 field-margin">{{item.itemDescription}}</div>
        <div class="col-md-3 col-lg-3 col-sm-3 field-margin">
            Quantity: <input [(ngModel)]="item.itemQuantity" (change)="udpateQuantity(item, i)" 
                class="form-control quantity-input"
                maxlength="2" min="1" type="number" />
        </div>
        <div class="col-md-2 col-lg-2 col-sm-3 field-margin" style="font-weight: 700;">Rs. {{item.itemPrice}}</div>
        <div class="col-md-1 col-lg-1 col-sm-3 field-margin">
            <img src="assets/icons/delete.jpg" title="Remove" class="delete-img" (click)="deleteItem(item.itemId, i)"/>
        </div>
    </div>
</div>
<div *ngIf="!cartData.length" [style.background-image]="'url(assets/icons/emptycart.png)'" class="empty-cart">
</div>
